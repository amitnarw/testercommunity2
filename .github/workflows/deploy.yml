name: 🚀 Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      NEXT_PUBLIC_ENCRYPTION_SECRET: ${{ secrets.NEXT_PUBLIC_ENCRYPTION_SECRET }}

    steps:
      # 1️⃣ Checkout code
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      # ⏱️ Capture start time
      - name: ⏱️ Capture start time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      # 2️⃣ Setup Node.js
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: 📦 Install dependencies
        run: npm ci

      # 4️⃣ Build Next.js
      - name: 🏗️ Build Next.js
        run: npm run build

      # 5️⃣ Verify build output
      - name: 🚨 Verify build output
        run: |
          test -d .next || (echo ".next missing" && exit 1)
          test -d public || (echo "public missing" && exit 1)
          test -f package.json || (echo "package.json missing" && exit 1)
          test -f next.config.ts || (echo "next.config.ts missing" && exit 1)

      # 6️⃣ Setup SSH
      # R7-deploy: ssh-keyscan was opening 4 parallel unauthenticated probe
      # connections (RSA/ECDSA/ED25519 /etc.) that the server was rate-limiting
      # or fail2ban-banning, causing "Connection closed by remote host" before
      # rsync could ever start. We let rsync's own SSH client do trust-on-first-
      # use (`StrictHostKeyChecking=accept-new`) — single connection, same
      # security, and stays consistent with the backend deploy workflow which
      # works through appleboy/ssh-action without keyscan.
      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 7️⃣ Sync build to server
      - name: 📤 Sync build to server (rsync)
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.ts \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/frontend

      # 8️⃣ Restart app
      - name: ♻️ Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/frontend
            npm install --production
            pm2 delete frontend || true
            # Prefer IPv4 DNS: the server's IPv6 egress to Google is flaky and
            # causes ETIMEDOUT on upstream image fetches (lh3/play.google.com).
            NODE_OPTIONS=--dns-result-order=ipv4first pm2 start npm --name frontend -- start
            pm2 save

      # ✅ Telegram Success Notification
      - name: 📣 Telegram Success Notification
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))

          MESSAGE="🚀 <b>FRONTEND DEPLOYED SUCCESSFULLY</b>%0A
          ⏱ Duration: <b>${MIN}m ${SEC}s</b>%0A
          📦 Repo: <b>${{ github.repository }}</b>%0A
          🌿 Branch: <b>${{ github.ref_name }}</b>%0A
          👤 By: <b>${{ github.actor }}</b>%0A
          🧾 Commit: <b>${{ github.event.head_commit.message }}</b>%0A
          🔗 <a href='${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}'>View Commit</a>"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="$MESSAGE"

      # ❌ Telegram Failure Notification
      - name: ❌ Telegram Failure Notification
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))

          MESSAGE="❌ <b>FRONTEND DEPLOYMENT FAILED</b>%0A
          ⏱ Failed After: <b>${MIN}m ${SEC}s</b>%0A
          📦 Repo: <b>${{ github.repository }}</b>%0A
          👤 By: <b>${{ github.actor }}</b>%0A
          ⚠️ Check GitHub Actions logs."

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="$MESSAGE"
